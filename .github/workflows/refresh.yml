name: Refresh Movie Sagas

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: movie-sagas-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check TMDB access
        id: credentials
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_READ_TOKEN" ] || [ -n "$TMDB_API_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Setup pending: add a personal TMDB credential in repository Actions secrets.'
          fi
      - name: Test catalogue rules
        run: python -m unittest discover -s tests -v
      - name: Restore public catalogue cache
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/state.json
          key: movie-sagas-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: movie-sagas-state-v1-
      - name: Refresh from TMDB
        if: steps.credentials.outputs.ready == 'true'
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python src/build.py --config config.json --output dist --state .cache/state.json
          cp site/index.html dist/index.html
          cp -r assets dist/assets
          touch dist/.nojekyll
      - name: Save validated public catalogue cache
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/state.json
          key: movie-sagas-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record successful catalogue refresh
        if: steps.credentials.outputs.ready == 'true'
        run: |
          mkdir -p data
          cp dist/selections.json data/latest-selection.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest-selection.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh saga selection status'
            git push origin HEAD:main
          fi
      - name: Upload validated site
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish catalogue
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
